# Builds the TAKTO companion app as an installable Android APK on GitHub's
# runners (Android SDK preinstalled), so nobody needs Android Studio, a local
# 6 GB toolchain or an Expo account to put it on a phone. The APK is kept as a
# workflow artifact (Actions run page -> Artifacts); nothing is published as a
# release.
name: companion-apk

on:
  workflow_dispatch:
  push:
    branches: [thesis-twin]
    paths: ['software/app/**', '.github/workflows/companion-apk.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: software/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: software/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: software/app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk "TAKTO-Companion-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TAKTO-Companion-apk
          path: software/app/TAKTO-Companion-*.apk
          retention-days: 30
